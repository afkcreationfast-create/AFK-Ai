<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK AI - Assistant Professionnel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 800px; height: 90vh; background: var(--chat-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
        header { padding: 20px; background: #111827; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
        .status { font-size: 0.85rem; color: #10b981; display: flex; align-items: center; gap: 6px; }
        .status::before { content: ''; width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
        .auth-bar { padding: 10px 20px; background: #1e293b; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
        .auth-bar input { background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 6px 12px; border-radius: 6px; outline: none; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; }
        .user-msg { background: var(--accent-color); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #334155; color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background: #111827; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .input-area textarea { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; resize: none; height: 50px; outline: none; }
        .input-area textarea:focus { border-color: var(--accent-color); }
        .input-area button { background: var(--accent-color); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .input-area button:hover { background: var(--accent-hover); }
        .limit-banner { background: #ef4444; color: white; padding: 10px; text-align: center; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ AFK AI</div>
            <div class="status">En ligne</div>
        </header>
        <div class="auth-bar">
            <label>Utilisateur :</label>
            <input type="text" id="usernameInput" placeholder="Ton nom..." value="Utilisateur1">
            <label style="margin-left: auto;">Admin :</label>
            <input type="password" id="adminPassInput" placeholder="Mot de passe admin">
        </div>
        <div id="limitBanner" class="limit-banner">Limite atteinte ! Veuillez patienter ou passer à la version Premium.</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Bonjour ! Je suis **AFK AI**. Comment puis-je vous aider aujourd'hui ?</div>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="Écris ton message ici..." rows="1"></textarea>
            <button id="sendBtn">Envoyer</button>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const usernameInput = document.getElementById('usernameInput');
        const adminPassInput = document.getElementById('adminPassInput');
        const limitBanner = document.getElementById('limitBanner');

        async function sendMessage() {
            const message = userInput.value.trim();
            const username = usernameInput.value.trim() || 'Anonyme';
            const adminPassword = adminPassInput.value.trim();
            if (!message) return;
            appendMessage(message, 'user-msg');
            userInput.value = '';
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, message, isAdmin: adminPassword !== '', adminPassword })
                });
                const data = await response.json();
                if (response.status === 429) {
                    limitBanner.style.display = 'block';
                    limitBanner.innerText = data.error;
                    return;
                }
                if (data.reply) {
                    appendMessage(data.reply, 'bot-msg');
                } else if (data.error) {
                    appendMessage("Erreur : " + data.error, 'bot-msg');
                }
            } catch (err) {
                appendMessage("Erreur de connexion au serveur.", 'bot-msg');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
